<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body{font:14px Arial,sans-serif;max-width:1100px;margin:28px auto;padding:0 16px;color:#202124}
    h2{margin-bottom:6px} .muted{color:#666}.panel{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}
    button{padding:9px 15px;border:0;border-radius:6px;background:#1769aa;color:white;cursor:pointer}
    button:disabled{opacity:.5;cursor:default} input{margin:10px 0}
    table{border-collapse:collapse;width:100%;font-size:12px} th,td{border:1px solid #ddd;padding:6px;text-align:left}
    th{background:#f3f5f7;position:sticky;top:0}.scroll{max-height:420px;overflow:auto}
    .ok{color:#137333}.bad{color:#b3261e} .stats{display:flex;gap:18px;flex-wrap:wrap}
  </style>
</head>
<body>
  <h2>SeaBank PDF Importer</h2>
  <div class="muted">Pilih e-Statement PDF. Data hanya dipreview, belum disimpan sampai validasi berhasil.</div>
  <div class="panel">
    <input id="pdfFile" type="file" accept="application/pdf">
    <button id="readBtn" onclick="readPdf()">Baca PDF & Preview</button>
    <div id="status" class="muted"></div>
  </div>
  <div id="summary" class="panel" hidden></div>
  <div class="panel">
    <div class="stats"><strong id="count">0 transaksi</strong><strong id="check"></strong></div>
    <div class="scroll"><table><thead><tr>
      <th>Tanggal</th><th>Transaction</th><th>Transaction Type</th><th>Account</th>
      <th>Outgoing</th><th>Incoming</th><th>Ending Balance</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
    <p><button id="saveBtn" onclick="saveStatement()" disabled>Simpan ke Google Sheets</button></p>
  </div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let parsedStatement=null;

function setStatus(s, bad=false){const e=document.getElementById('status');e.textContent=s;e.className=bad?'bad':'muted';}
function money(s){return Number(String(s||'').replace(/[^0-9]/g,''))||0;}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim();}
function monthNum(m){return ({JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11})[m] ?? -1;}
function toDate(d,m,year){return new Date(year,monthNum(m),Number(d));}
function dateText(dt){return UtilitiesDate(dt);}
function UtilitiesDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}

async function pageLines(page){
  const content=await page.getTextContent();
  const buckets=[];
  content.items.forEach(it=>{
    if(!it.str || !it.str.trim()) return;
    const x=it.transform[4], y=it.transform[5];
    let line=buckets.find(b=>Math.abs(b.y-y)<2.0);
    if(!line){line={y,items:[]};buckets.push(line);}
    line.items.push({x,text:it.str.trim()});
  });
  return buckets.sort((a,b)=>b.y-a.y).map(b=>{
    b.items.sort((a,c)=>a.x-c.x);
    return {y:b.y,items:b.items,text:clean(b.items.map(i=>i.text).join(' '))};
  });
}

function isType(s){
  return ['Transfer','Payment','Interest','Tax','Top Up - eWallet','Time Deposit','Reward','Adjustment','Bill - PDAM'].includes(clean(s));
}
function accountCandidate(s){
  const v=clean(s);
  return /\b(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI)\b.*\d{5,}/i.test(v) ||
         /\b(DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)\b.*\d{8,}/i.test(v) ||
         /\b\d{10,16}\b/.test(v);
}
function splitDesc(lines){
  const desc=[], accounts=[], candidates=[];
  lines.forEach(line=>{
    const s=clean(line.text);
    if(!s || /^(DATE|TRANSACTION|OUTGOING|INCOMING|END BALANCE|BANK STATEMENT|S\/N|page )/i.test(s)) return;
    const candidate=clean(line.items.filter(it=>it.x>=130 && it.x<280).map(it=>it.text).join(' '));
    const raw=clean(line.text);
    const combinedAccount=/^(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)\s+\d{5,16}$/i.test(raw);
    if(combinedAccount) {
      candidates.push(raw);
    } else {
      if(candidate) candidates.push(candidate);
      // Account numbers can be positioned outside the normal description column.
      if(/^\d{5,16}$/.test(raw)) candidates.push(raw);
      else if(!candidate && /^(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)$/i.test(raw)) candidates.push(raw);
    }
  });
  for(let i=0;i<candidates.length;i++){
    const value=candidates[i];
    if(/^(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)$/i.test(value) &&
       i+1<candidates.length && /^\d{5,16}$/.test(candidates[i+1])){
      accounts.push(value+' '+candidates[++i]);
    } else if(accountCandidate(value)) {
      accounts.push(value);
    } else {
      desc.push(value);
    }
  }
  return {transaction:clean(desc.join(' ')),account:clean(accounts.join(' '))};
}
function parsePage(lines, year, carry){
  let active=false, stop=false;
  const out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i], txt=line.text;
    if(/TIME DEPOSIT - INTEREST & TAX DETAILS/i.test(txt)){stop=true;active=false;}
    if(stop) continue;
    if(/^DATE\b.*TRANSACTION/i.test(txt) || /^DATE\s+TRANSACTION/i.test(txt)) {active=true;continue;}
    if(!active) continue;
    const m=txt.match(/^(\d{1,2})\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\b/i);
    if(!m) {
      if(isType(txt) && carry.current){
        carry.current.transactionType=txt;
        out.push(carry.current); carry.current=null; carry.pending=[];
      } else if(carry.current && txt) {
        // Detail rows after the dated row belong to the active transaction.
        // Bank and account number are often printed on separate rows.
        const bank=txt.match(/\b(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)\b/i);
        const acct=txt.match(/\b\d{5,16}\b/);
        if(bank) {
          carry.current.account=clean([carry.current.account,bank[1].toUpperCase()].filter(Boolean).join(' '));
          carry.current.transaction=clean(carry.current.transaction.replace(new RegExp('\\b'+bank[1]+'\\b','ig'),''));
        }
        if(acct) {
          const bankInName=carry.current.transaction.match(/\b(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)\b/i);
          if(bankInName) {
            carry.current.account=clean([carry.current.account,bankInName[1].toUpperCase()].filter(Boolean).join(' '));
            carry.current.transaction=clean(carry.current.transaction.replace(new RegExp('\\b'+bankInName[1]+'\\b','ig'),''));
          }
          if(carry.current.account && !/\d{5,16}/.test(carry.current.account)) carry.current.account+=' '+acct[0];
          else if(!carry.current.account) carry.current.account=acct[0];
        }
        const remainder=clean(txt.replace(/\b(BRI|BCA|BNI|MANDIRI|CIMB|DANAMON|PERMATA|BSI|DANA|GOPAY|OVO|SHOPEEPAY|LINKAJA)\b/ig,'').replace(/\b\d{5,16}\b/g,''));
        if(remainder && !/^[-.]+$/.test(remainder)) carry.current.transaction=clean(carry.current.transaction+' '+remainder);
      } else if(txt && !/^(page \d+|BANK STATEMENT|S\/N )/i.test(txt)) {
        carry.pending.push(line);
      }
      continue;
    }
    const dt=toDate(m[1],m[2].toUpperCase(),year);
    const descLines=carry.pending.concat([line]);
    const parts=splitDesc(descLines);
    const nums=line.items.filter(it=>it.x>=280 && /\d[\d.]*\d|^\d$/.test(it.text));
    let outgoing=0,incoming=0,ending=0;
    nums.forEach(it=>{
      const val=money(it.text);
      if(it.x>=485) ending=val;
      else if(it.x>=390) incoming=val;
      else if(it.x>=280) outgoing=val;
    });
    if(carry.current){out.push(carry.current);}
    carry.current={
      date:dateText(dt),transaction:parts.transaction,transactionType:'',
      account:parts.account,outgoing,incoming,endingBalance:ending
    };
    carry.pending=[];
  }
  return out;
}

function parseStatementGroup(reference, pages) {
  const firstText=pages[0].map(x=>x.text).join('\n');
  const period=firstText.match(/(\d{2})\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s+2026\s+to\s+(\d{2})\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s+2026/i);
  const totals=firstText.match(/SAVINGS\s+([\d,.]+)\s+([\d,.]+)\s+([\d,.]+)\s+([\d,.]+)/i);
  if(!period || !totals) throw new Error('Ringkasan tidak terbaca untuk '+reference);
  const startDate=toDate(period[1],period[2].toUpperCase(),2026), endDate=toDate(period[3],period[4].toUpperCase(),2026);
  const openingBalance=money(totals[1]), totalOutgoing=money(totals[2]), totalIncoming=money(totals[3]), endingBalance=money(totals[4]);
  const carry={pending:[],current:null}; let transactions=[];
  pages.forEach(lines=>{transactions.push(...parsePage(lines,2026,carry));});
  if(carry.current) transactions.push(carry.current);
  transactions=transactions.filter(t=>t.transactionType && t.endingBalance>0);
  const sumOut=transactions.reduce((s,t)=>s+t.outgoing,0), sumIn=transactions.reduce((s,t)=>s+t.incoming,0);
  const last=transactions[transactions.length-1]; let running=openingBalance, runningValid=true;
  transactions.forEach(t=>{if(running-t.outgoing+t.incoming!==t.endingBalance) runningValid=false; running=t.endingBalance;});
  const checks=[['Jumlah transaksi',transactions.length>0],['Total outgoing',sumOut===totalOutgoing],['Total incoming',sumIn===totalIncoming],['Saldo akhir',!!last&&last.endingBalance===endingBalance],['Saldo berjalan',runningValid]];
  return {reference,periodStart:dateText(startDate),periodEnd:dateText(endDate),openingBalance,totalOutgoing,totalIncoming,endingBalance,transactions,sumOutgoing:sumOut,sumIncoming:sumIn,checks,valid:checks.every(c=>c[1])};
}
async function readPdf(){
  const file=document.getElementById('pdfFile').files[0];
  if(!file){setStatus('Pilih file PDF terlebih dahulu.',true);return;}
  document.getElementById('readBtn').disabled=true; document.getElementById('saveBtn').disabled=true; parsedStatement=null; setStatus('Membaca PDF...');
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const groups=new Map();
    for(let n=1;n<=pdf.numPages;n++){
      const lines=await pageLines(await pdf.getPage(n));
      const hit=lines.map(x=>x.text).join(' ').match(/S\/N\s+(S\d{2}-\d{6}[A-Z0-9]{8})/);
      if(hit){if(!groups.has(hit[1]))groups.set(hit[1],[]);groups.get(hit[1]).push(lines);}
    }
    if(!groups.size)throw new Error('Nomor statement tidak ditemukan di PDF.');
    const statements=[...groups.entries()].map(([ref,pages])=>parseStatementGroup(ref,pages)).sort((a,b)=>a.periodStart.localeCompare(b.periodStart));
    const totalTx=statements.reduce((s,x)=>s+x.transactions.length,0), allValid=statements.every(x=>x.valid);
    parsedStatement={statements};
    document.getElementById('summary').hidden=false;
    document.getElementById('summary').innerHTML='<b>'+statements.length+' statement ditemukan</b>'+statements.map(s=>'<div style="border-top:1px solid #ddd;padding:9px 0"><b>'+s.reference+'</b> · '+s.periodStart+' s.d. '+s.periodEnd+'<div class="stats"><span>Transaksi: '+s.transactions.length+'</span><span>Keluar: '+fmt(s.sumOutgoing)+'</span><span>Masuk: '+fmt(s.sumIncoming)+'</span><span>Saldo akhir: '+fmt(s.endingBalance)+'</span></div><p class="'+(s.valid?'ok':'bad')+'">'+s.checks.map(c=>(c[1]?'✓ ':'✗ ')+c[0]).join(' | ')+'</p></div>').join('');
    document.getElementById('count').textContent=totalTx+' transaksi dari '+statements.length+' statement';
    document.getElementById('check').textContent=allValid?'Semua validasi lolos':'Ada statement yang belum valid'; document.getElementById('check').className=allValid?'ok':'bad';
    const preview=statements.flatMap(s=>s.transactions);
    document.getElementById('rows').innerHTML=preview.map(t=>'<tr><td>'+t.date+'</td><td>'+esc(t.transaction)+'</td><td>'+esc(t.transactionType)+'</td><td>'+esc(t.account)+'</td><td>'+fmt(t.outgoing)+'</td><td>'+fmt(t.incoming)+'</td><td>'+fmt(t.endingBalance)+'</td></tr>').join('');
    document.getElementById('saveBtn').disabled=!allValid;
    setStatus(allValid?'Preview selesai. Periksa seluruh statement sebelum menyimpan.':'Validasi gagal pada satu atau beberapa statement. Jangan simpan.',!allValid);
    if(!allValid)parsedStatement=null;
  }catch(e){setStatus(e.message||String(e),true);}finally{document.getElementById('readBtn').disabled=false;}
}
function fmt(n){return Number(n||0).toLocaleString('id-ID');}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveStatement(){
  if(!parsedStatement)return;
  document.getElementById('saveBtn').disabled=true;
  setStatus('Menyimpan transaksi...');
  google.script.run.withSuccessHandler(r=>{
    setStatus('Berhasil menyimpan '+r.imported+' transaksi ('+r.reference+').');
  }).withFailureHandler(e=>{
    setStatus(e.message||String(e),true);document.getElementById('saveBtn').disabled=false;
  }).importStatements(parsedStatement);
}
</script>
</body>
</html>
